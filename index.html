<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformer as WhatsApp Group</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .header {
            background: #25d366;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            display: flex;
            height: 80vh;
        }
        
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
        }
        
        .explanation-section {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .chat-header {
            background: #075e54;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .group-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #25d366;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #ece5dd;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .message.highlight {
            background: rgba(255, 235, 59, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
        }
        
        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        
        .message-content {
            flex: 1;
        }
        
        .sender {
            font-weight: bold;
            color: #075e54;
            font-size: 14px;
            margin-bottom: 2px;
        }
        
        .text {
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .time {
            font-size: 11px;
            color: #667781;
            margin-top: 4px;
        }
        
        .step-explanation {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #25d366;
        }
        
        .step-title {
            color: #075e54;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .step-content {
            line-height: 1.6;
            color: #333;
        }
        
        .math-formula {
            background: #f0f8ff;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            border-left: 3px solid #4CAF50;
        }
        
        .controls {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #25d366;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #128c7e;
        }
        
        .btn.active {
            background: #075e54;
        }
        
        .token-highlight {
            background: rgba(255, 193, 7, 0.3);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .attention-arrow {
            color: #ff5722;
            font-weight: bold;
            margin: 0 5px;
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                height: auto;
            }
            
            .chat-section, .explanation-section {
                flex: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Transformer as WhatsApp Group Chat</h1>
            <p>Understanding AI through everyday group conversations</p>
        </div>
        
        <div class="content">
            <div class="chat-section">
                <div class="chat-header">
                    <div class="group-avatar">🧠</div>
                    <div>
                        <div style="font-weight: bold;">AI Study Group</div>
                        <div style="font-size: 12px; opacity: 0.8;">Alex, Maya, Sam, Chris</div>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be populated by JavaScript -->
                </div>
            </div>
            
            <div class="explanation-section" id="explanationSection">
                <!-- Explanations will be populated by JavaScript -->
            </div>
        </div>
        
        <div class="controls">
            <button class="btn active" onclick="showStep(0)">1. Input Messages</button>
            <button class="btn" onclick="showStep(1)">2. Timestamps</button>
            <button class="btn" onclick="showStep(2)">3. Attention</button>
            <button class="btn" onclick="showStep(3)">4. Multiple Views</button>
            <button class="btn" onclick="showStep(4)">5. Prediction</button>
        </div>
    </div>

    <script>
        const chatData = {
            0: [ // Input Messages
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM", highlight: true },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM" }
            ],
            1: [ // Positional Encoding
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM", position: "[Position 1]" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM", position: "[Position 2]", highlight: true },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM", position: "[Position 3]" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM", position: "[Position 4]" }
            ],
            2: [ // Self-Attention
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with <span class='token-highlight'>machine learning</span>?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What <span class='token-highlight'>specific topic</span>?", time: "2:16 PM", highlight: true },
                { sender: "Sam", color: "#2196f3", text: "I'm studying <span class='token-highlight'>transformers</span> right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "<span class='token-highlight'>Transformers</span> are fascinating!", time: "2:18 PM" },
                { sender: "System", color: "#4caf50", text: "🔍 Maya is checking: 'machine learning' <span class='attention-arrow'>→</span> 'transformers' (High relevance!)", time: "Processing", highlight: true }
            ],
            3: [ // Multi-Head Attention
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM", highlight: true },
                { sender: "Maya (Grammar Head)", color: "#9c27b0", text: "🔍 Checking grammar and syntax patterns", time: "Processing" },
                { sender: "Sam (Context Head)", color: "#2196f3", text: "🔍 Looking for topic relationships and context", time: "Processing" },
                { sender: "Chris (Sentiment Head)", color: "#ff9800", text: "🔍 Analyzing emotional tone and enthusiasm", time: "Processing", highlight: true }
            ],
            4: [ // Prediction
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM" },
                { sender: "AI Prediction", color: "#4caf50", text: "Next message likely: 'Let me explain transformers...' (85% confidence)", time: "Predicting", highlight: true },
                { sender: "Chris", color: "#ff9800", text: "Let me explain how they work! 🤖", time: "2:19 PM", highlight: true }
            ]
        };
        
        const explanations = {
            0: {
                title: "1. Input Embeddings = Messages in Chat",
                content: `
                    <p><strong>What's happening:</strong> Each message in the group chat gets converted into a mathematical vector (like a unique fingerprint).</p>
                    
                    <div class="math-formula">
                        Each message → Vector: x<sub>t</sub> ∈ R<sup>d_model</sup>
                        <br>Where t = message position, d_model = vector size
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• Alex's message "Hey guys, can anyone help me with machine learning?" becomes a 512-dimensional vector</p>
                    <p>• Each word gets its own vector: ["Hey"→[0.2,0.8,...],"guys"→[0.1,0.4,...], etc.]</p>
                    <p>• Just like how WhatsApp stores each message with metadata, transformers store each word with rich mathematical information</p>
                    
                    <p><strong>Why this matters:</strong> The AI needs to convert human language into numbers it can process, just like how your phone converts your voice into digital signals.</p>
                `
            },
            1: {
                title: "2. Positional Encoding = Message Timestamps",
                content: `
                    <p><strong>What's happening:</strong> Since order matters in conversations, we add position information to each message vector.</p>
                    
                    <div class="math-formula">
                        PE(pos,2i) = sin(pos/10000<sup>2i/d_model</sup>)
                        <br>PE(pos,2i+1) = cos(pos/10000<sup>2i/d_model</sup>)
                        <br>Final input: z<sub>t</sub> = x<sub>t</sub> + PE<sub>t</sub>
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• Maya's message at 2:16 PM gets position encoding [Position 2]</p>
                    <p>• Just like WhatsApp shows timestamps, the AI knows "Sure! What specific topic?" came AFTER "Hey guys, can anyone help me..."</p>
                    <p>• Without this, the AI might think Maya asked the question first!</p>
                    
                    <p><strong>Why this matters:</strong> "I'm not going" vs "I'm going, not!" - word order completely changes meaning!</p>
                `
            },
            2: {
                title: "3. Self-Attention = Friends Re-reading Carefully",
                content: `
                    <p><strong>What's happening:</strong> Each person in the chat looks back at previous messages to understand context before responding.</p>
                    
                    <div class="math-formula">
                        Attention(Q,K,V) = softmax(QK<sup>T</sup>/√d<sub>k</sub>)V
                        <br>Q = queries (what am I looking for?)
                        <br>K = keys (labels/topics in past messages)  
                        <br>V = values (actual message content)
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• Maya sees Alex asked about "machine learning" 🔍</p>
                    <p>• She spots Sam mentioned "transformers" - highly relevant!</p>
                    <p>• Maya's brain: "Alex wants ML help → Sam mentioned transformers → I should connect these!"</p>
                    <p>• This is exactly what attention does - finds relevant connections</p>
                    
                    <p><strong>Why this matters:</strong> Humans naturally reference previous messages. AI needs to do the same to stay coherent!</p>
                `
            },
            3: {
                title: "4. Multi-Head Attention = Different Friend Perspectives",
                content: `
                    <p><strong>What's happening:</strong> Instead of one person reading the chat, multiple friends each focus on different aspects simultaneously.</p>
                    
                    <div class="math-formula">
                        MHA(X) = [head₁; head₂; ...; head_h]W^O
                        <br>Each head focuses on different patterns
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• <strong>Maya (Grammar Head):</strong> "Is this question properly formed?"</p>
                    <p>• <strong>Sam (Context Head):</strong> "How does this relate to our previous ML discussions?"</p>
                    <p>• <strong>Chris (Sentiment Head):</strong> "Chris sounds excited about transformers!"</p>
                    <p>• Together, they get a richer understanding than any single perspective</p>
                    
                    <p><strong>Why this matters:</strong> Just like how different friends notice different things in a conversation, multiple attention heads catch various linguistic patterns!</p>
                `
            },
            4: {
                title: "5. Output Layer = Predicting Next Message",
                content: `
                    <p><strong>What's happening:</strong> Based on all the analysis, the AI predicts what the most likely next message should be.</p>
                    
                    <div class="math-formula">
                        P(y<sub>t</sub>|y<sub>&lt;t</sub>, X) = softmax(W<sub>o</sub>h<sub>t</sub>)
                        <br>Where h<sub>t</sub> = processed chat context
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• Alex asked about ML → Maya offered help → Sam mentioned transformers → Chris showed excitement</p>
                    <p>• Pattern suggests next message will likely be: someone explaining transformers!</p>
                    <p>• AI predicted: "Let me explain transformers..." (85% confidence)</p>
                    <p>• Chris actually wrote: "Let me explain how they work! 🤖" ✅</p>
                    
                    <p><strong>Why this matters:</strong> This is how ChatGPT, GPT-4, and other AI assistants generate human-like responses - by predicting the most appropriate next words based on conversation context!</p>
                `
            }
        };
        
        let currentStep = 0;
        
        function showStep(step) {
            currentStep = step;
            
            // Update button states
            document.querySelectorAll('.btn').forEach((btn, index) => {
                btn.classList.toggle('active', index === step);
            });
            
            // Update chat messages
            const chatDiv = document.getElementById('chatMessages');
            chatDiv.innerHTML = '';
            
            chatData[step].forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.highlight ? 'highlight' : ''}`;
                
                messageDiv.innerHTML = `
                    <div class="avatar" style="background: ${msg.color}">${msg.sender[0]}</div>
                    <div class="message-content">
                        <div class="sender">${msg.sender} ${msg.position || ''}</div>
                        <div class="text">${msg.text}</div>
                        <div class="time">${msg.time}</div>
                    </div>
                `;
                
                chatDiv.appendChild(messageDiv);
            });
            
            // Update explanation
            const explanationDiv = document.getElementById('explanationSection');
            const exp = explanations[step];
            explanationDiv.innerHTML = `
                <div class="step-explanation">
                    <div class="step-title">${exp.title}</div>
                    <div class="step-content">${exp.content}</div>
                </div>
            `;
            
            // Scroll to top of explanations
            explanationDiv.scrollTop = 0;
        }
        
        // Initialize with first step
        showStep(0);
        
        // Auto-advance demo (optional)
        let autoAdvance = false;
        function startAutoDemo() {
            if (autoAdvance) return;
            autoAdvance = true;
            
            const interval = setInterval(() => {
                currentStep = (currentStep + 1) % 5;
                showStep(currentStep);
                
                if (currentStep === 0) {
                    clearInterval(interval);
                    autoAdvance = false;
                }
            }, 4000);
        }
        
        // Add click handler for auto demo
        document.querySelector('.header').addEventListener('dblclick', startAutoDemo);
    </script>
</body>
</html>
