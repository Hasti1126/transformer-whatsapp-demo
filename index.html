<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Transformer as WhatsApp Group</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .header {
            background: #25d366;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            display: flex;
            height: 80vh;
        }
        
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
        }
        
        .explanation-section {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .chat-header {
            background: #075e54;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .group-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #25d366;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #ece5dd;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .message.highlight {
            background: rgba(255, 235, 59, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
        }
        
        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        
        .message-content {
            flex: 1;
        }
        
        .sender {
            font-weight: bold;
            color: #075e54;
            font-size: 14px;
            margin-bottom: 2px;
        }
        
        .text {
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .time {
            font-size: 11px;
            color: #667781;
            margin-top: 4px;
        }
        
        .step-explanation {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #25d366;
        }
        
        .step-title {
            color: #075e54;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .step-content {
            line-height: 1.6;
            color: #333;
        }
        
        .math-formula {
            background: #f0f8ff;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            border-left: 3px solid #4CAF50;
        }
        
        .controls {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #25d366;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #128c7e;
        }
        
        .btn.active {
            background: #075e54;
        }
        
        .token-highlight {
            background: rgba(255, 193, 7, 0.3);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .attention-arrow {
            color: #ff5722;
            font-weight: bold;
            margin: 0 5px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .content {
                flex-direction: column;
                height: auto;
            }
            
            .chat-section {
                height: 50vh;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
            
            .explanation-section {
                height: 50vh;
                padding: 15px;
            }
            
            .header h1 {
                font-size: 18px;
            }
            
            .header p {
                font-size: 12px;
            }
            
            .controls {
                padding: 15px;
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 12px;
                flex: 1;
                min-width: 120px;
            }
            
            .step-title {
                font-size: 16px;
            }
            
            .math-formula {
                font-size: 12px;
                overflow-x: auto;
            }
            
            .message {
                margin-bottom: 12px;
            }
            
            .avatar {
                width: 30px;
                height: 30px;
                font-size: 11px;
            }
            
            .sender {
                font-size: 13px;
            }
            
            .text {
                font-size: 14px;
                padding: 6px 10px;
            }
            
            .time {
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
            }
            
            .btn {
                min-width: auto;
            }
            
            .header {
                padding: 15px;
            }
            
            .chat-messages {
                padding: 15px;
            }
            
            .explanation-section {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <script>
        const chatData = {
            0: [ // Input Messages
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM", highlight: true },

            ],
            1: [ // Positional Encoding
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM", position: "[Position 1]" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM", position: "[Position 2]", highlight: true },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM", position: "[Position 3]" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM", position: "[Position 4]" }
            ],
            2: [ // Encoder - Self-Attention
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with <span class='token-highlight'>machine learning</span>?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What <span class='token-highlight'>specific topic</span>?", time: "2:16 PM", highlight: true },
                { sender: "Sam", color: "#2196f3", text: "I'm studying <span class='token-highlight'>transformers</span> right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "<span class='token-highlight'>Transformers</span> are fascinating!", time: "2:18 PM" },
                { sender: "🧠 Encoder", color: "#4caf50", text: "📖 Reading & understanding all past messages... Finding connections between 'machine learning' and 'transformers'", time: "Processing", highlight: true }
            ],
            3: [ // Multi-Head Attention (Encoder)
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM", highlight: true },
                { sender: "🧠 Encoder Head 1", color: "#9c27b0", text: "🔍 Grammar Focus: Checking sentence structure and syntax", time: "Processing" },
                { sender: "🧠 Encoder Head 2", color: "#2196f3", text: "🔍 Context Focus: Connecting ML → Transformers topic relationship", time: "Processing" },
                { sender: "🧠 Encoder Head 3", color: "#ff9800", text: "🔍 Sentiment Focus: Chris shows enthusiasm about transformers!", time: "Processing", highlight: true }
            ],
            4: [ // Decoder Start
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM" },
                { sender: "🎯 Decoder", color: "#ff5722", text: "✍️ Now generating response... Looking at encoder's understanding + what I've written so far", time: "Generating", highlight: true },
                { sender: "Chris", color: "#ff9800", text: "Let me explain how they work! 🤖", time: "2:19 PM" }
            ],
            5: [ // Cross-Attention (Decoder looking at Encoder)
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM" },
                { sender: "Chris", color: "#ff9800", text: "Let me explain how they work! 🤖", time: "2:19 PM" },
                { sender: "🎯 Decoder", color: "#ff5722", text: "🔗 Cross-Attention: Consulting encoder's analysis while generating 'A transformer processes...'", time: "Generating", highlight: true },
                { sender: "Chris", color: "#ff9800", text: "A transformer processes text like our group chat - everyone reads, connects ideas, then responds!", time: "2:19 PM" }
            ],
            6: [ // Final Prediction
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating! Let me explain how they work! 🤖", time: "2:18 PM" },
                { sender: "Chris", color: "#ff9800", text: "A transformer processes text like our group chat - everyone reads, connects ideas, then responds!", time: "2:19 PM", highlight: true },
                { sender: "🎯 Final Output", color: "#4caf50", text: "✅ Complete response generated! Encoder understood context → Decoder generated relevant explanation", time: "Complete", highlight: true }
            ]
        };
        
        const explanations = {
            0: {
                title: "1. Input Embeddings = Messages in Chat",
                content: `
                    <p><strong>What's happening:</strong> Each message in the group chat gets converted into a mathematical vector (like a unique fingerprint).</p>
                    
                    <div class="math-formula">
                        Each message → Vector: x<sub>t</sub> ∈ R<sup>d_model</sup>
                        <br><br><strong>Where:</strong>
                        <br>• t = token/word position in sequence (1, 2, 3...)
                        <br>• d_model = embedding dimension (typically 512 or 768)
                        <br>• R<sup>d_model</sup> = Real number space with d_model dimensions
                        <br><br>For sentence with n words: X = [x₁, x₂, ..., xₙ] ∈ R<sup>n×d_model</sup>
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• Alex's message "Hey guys, can anyone help me with machine learning?"</p>
                    <p>• Each word gets converted: "Hey"→[0.2, 0.8, -0.1, ...] (512 numbers)</p>
                    <p>• "guys"→[0.1, 0.4, 0.9, ...] (another 512 numbers)</p>
                    <p>• Like giving each word a unique mathematical ID that captures its meaning</p>
                    
                    <p><strong>Why this matters:</strong> Computers need numbers, not words. This converts "machine learning" into math the AI can understand and process!</p>
                `
            },
            1: {
                title: "2. Positional Encoding = Message Timestamps",
                content: `
                    <p><strong>What's happening:</strong> Since transformers process all words simultaneously, we need to add position information so they know word order.</p>
                    
                    <div class="math-formula">
                        PE(pos, 2i) = sin(pos / 10000<sup>2i/d_model</sup>)
                        <br>PE(pos, 2i+1) = cos(pos / 10000<sup>2i/d_model</sup>)
                        <br><br><strong>Where:</strong>
                        <br>• pos = position of word in sequence (0, 1, 2, 3...)
                        <br>• i = dimension index (0, 1, 2, ..., d_model/2)
                        <br>• 2i = even dimensions use sine
                        <br>• 2i+1 = odd dimensions use cosine
                        <br>• 10000 = scaling factor for different frequencies
                        <br><br>Final input: z<sub>t</sub> = x<sub>t</sub> + PE<sub>t</sub>
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• Position 0: "Hey" gets PE = [sin(0), cos(0), sin(0), cos(0)...]</p>
                    <p>• Position 1: "guys" gets PE = [sin(1), cos(1), sin(1/10000), cos(1/10000)...]</p>
                    <p>• Like timestamp: Maya's message at 2:16 PM comes after Alex's at 2:15 PM</p>
                    <p>• Without this: AI might think "learning machine help" = same as "help machine learning"</p>
                    
                    <p><strong>Why this matters:</strong> "I'm not going" ≠ "I'm going, not!" Word order changes everything in language!</p>
                `
            },
            2: {
                title: "3. Encoder Self-Attention = Friends Cross-Referencing",
                content: `
                    <p><strong>What's happening:</strong> Each word looks at ALL other words to understand relationships and context.</p>
                    
                    <div class="math-formula">
                        Q = XW<sup>Q</sup>, K = XW<sup>K</sup>, V = XW<sup>V</sup>
                        <br>Attention(Q,K,V) = softmax(QK<sup>T</sup>/√d<sub>k</sub>)V
                        <br><br><strong>Where:</strong>
                        <br>• Q (Query) = "What am I looking for?" (d_model × d_k)
                        <br>• K (Key) = "What topics/labels do I have?" (d_model × d_k)  
                        <br>• V (Value) = "What's my actual content?" (d_model × d_v)
                        <br>• W<sup>Q</sup>, W<sup>K</sup>, W<sup>V</sup> = learned weight matrices
                        <br>• d_k = key/query dimension (usually d_model/num_heads)
                        <br>• √d_k = scaling factor to prevent softmax saturation
                        <br>• softmax = converts scores to probabilities (sum = 1)
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• Word "help" (Query): "What am I related to?"</p>
                    <p>• All words (Keys): "machine"=topic, "learning"=subject, "transformers"=specific_topic</p>
                    <p>• Attention scores: help→machine (0.1), help→learning (0.8), help→transformers (0.9)</p>
                    <p>• Final: "help" gets context from "learning" and "transformers" content</p>
                    
                    <p><strong>Why this matters:</strong> Like reading a WhatsApp thread - you connect "help" with "machine learning" mentioned earlier!</p>
                `
            },
            3: {
                title: "4. Multi-Head Attention = Multiple Expert Friends",
                content: `
                    <p><strong>What's happening:</strong> Instead of one attention mechanism, we run multiple in parallel - each focusing on different types of relationships.</p>
                    
                    <div class="math-formula">
                        MultiHead(Q,K,V) = Concat(head₁, head₂, ..., head_h)W<sup>O</sup>
                        <br>head_i = Attention(QW<sub>i</sub><sup>Q</sup>, KW<sub>i</sub><sup>K</sup>, VW<sub>i</sub><sup>V</sup>)
                        <br><br><strong>Where:</strong>
                        <br>• h = number of attention heads (typically 8 or 16)
                        <br>• W<sub>i</sub><sup>Q</sup>, W<sub>i</sub><sup>K</sup>, W<sub>i</sub><sup>V</sup> = weight matrices for head i
                        <br>• Each head has dimension d_k = d_model/h
                        <br>• W<sup>O</sup> = output projection matrix (h×d_v, d_model)
                        <br>• Concat = concatenate all head outputs
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• <strong>Head 1 (Syntax Expert):</strong> "Is 'can anyone help' proper grammar?"</p>
                    <p>• <strong>Head 2 (Topic Expert):</strong> "How does 'machine learning' relate to 'transformers'?"</p>
                    <p>• <strong>Head 3 (Sentiment Expert):</strong> "Is this a question, request, or statement?"</p>
                    <p>• <strong>Head 4 (Entity Expert):</strong> "Who are the people? What are the technical terms?"</p>
                    <p>• All heads work simultaneously, then combine their insights!</p>
                    
                    <p><strong>Why this matters:</strong> Like having grammar expert + topic expert + emotion expert all analyze the same chat - richer understanding!</p>
                `
            },
            4: {
                title: "5. Decoder Self-Attention (Masked) = Writing Without Peeking",
                content: `
                    <p><strong>What's happening:</strong> When generating response word-by-word, the decoder can only look at words it has already written, not future words.</p>
                    
                    <div class="math-formula">
                        Masked-Attention(Q,K,V) = softmax((QK<sup>T</sup> + Mask)/√d<sub>k</sub>)V
                        <br><br><strong>Mask Matrix (for sequence length 4):</strong>
                        <br>[0, -∞, -∞, -∞]  ← Position 1 can't see positions 2,3,4
                        <br>[0,  0, -∞, -∞]  ← Position 2 can't see positions 3,4  
                        <br>[0,  0,  0, -∞]  ← Position 3 can't see position 4
                        <br>[0,  0,  0,  0]  ← Position 4 can see all previous
                        <br><br><strong>Where:</strong>
                        <br>• -∞ makes softmax output 0 (no attention to future)
                        <br>• 0 allows attention to current/past positions
                        <br>• This enforces left-to-right generation order
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• 🎯 Decoder starts typing: "Let"</p>
                    <p>• When writing "me", it can see "Let" but NOT "explain" or "transformers" (not written yet)</p>
                    <p>• When writing "explain", it can see "Let me" but NOT "transformers"</p>
                    <p>• Like typing in WhatsApp - you build message left-to-right, no time travel!</p>
                    
                    <p><strong>Why this matters:</strong> Prevents "cheating" - AI must generate responses naturally like humans do, one word at a time!</p>
                `
            },
            5: {
                title: "6. Cross-Attention = Consulting the Full Conversation",
                content: `
                    <p><strong>What's happening:</strong> While generating each new word, the decoder "looks back" at the encoder's understanding of the entire input conversation.</p>
                    
                    <div class="math-formula">
                        Cross-Attention(Q<sub>decoder</sub>, K<sub>encoder</sub>, V<sub>encoder</sub>)
                        <br>= softmax(Q<sub>dec</sub>K<sub>enc</sub><sup>T</sup>/√d<sub>k</sub>)V<sub>enc</sub>
                        <br><br><strong>Where:</strong>
                        <br>• Q<sub>decoder</sub> = queries from what decoder is generating
                        <br>• K<sub>encoder</sub> = keys from encoder's processed input  
                        <br>• V<sub>encoder</sub> = values from encoder's processed input
                        <br>• This allows decoder to attend to ANY part of input
                        <br>• No masking needed - decoder can see entire input context
                        <br>• Different from self-attention: Q from decoder, K,V from encoder
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• 🎯 Decoder generates: "A transformer"</p>
                    <p>• 🔗 Cross-Attention: "What was the original question about?"</p>
                    <p>• 🧠 Encoder: "Alex asked about 'machine learning', Sam mentioned 'transformers'"</p>
                    <p>• 🎯 Decoder: "Perfect! I'll explain transformers in ML context"</p>
                    <p>• Like scrolling up in WhatsApp while typing to stay on topic!</p>
                    
                    <p><strong>Why this matters:</strong> Keeps AI response relevant to original question - prevents going off-topic during generation!</p>
                `
            },
            6: {
                title: "7. Feed Forward Network + Layer Normalization",
                content: `
                    <p><strong>What's happening:</strong> After attention, each position gets processed through a neural network, with residual connections and normalization for stability.</p>
                    
                    <div class="math-formula">
                        FFN(x) = max(0, xW₁ + b₁)W₂ + b₂
                        <br>LayerNorm(x) = γ(x - μ)/σ + β
                        <br>Output = LayerNorm(x + Sublayer(x))
                        <br><br><strong>Where:</strong>
                        <br>• FFN = Feed Forward Network (2 linear layers + ReLU)
                        <br>• W₁, W₂ = weight matrices, b₁, b₂ = bias vectors
                        <br>• max(0, z) = ReLU activation (removes negatives)
                        <br>• μ = mean, σ = standard deviation of x
                        <br>• γ, β = learnable scale and shift parameters
                        <br>• x + Sublayer(x) = residual connection (skip connection)
                        <br>• Applied after both self-attention and cross-attention
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• <strong>Feed Forward:</strong> "Let me think deeper about this specific word"</p>
                    <p>• Like each friend taking notes after group discussion</p>
                    <p>• <strong>Residual Connection:</strong> "Don't forget the original message"</p>
                    <p>• Like keeping original chat + your analysis notes</p>
                    <p>• <strong>Layer Norm:</strong> "Keep thoughts organized and balanced"</p>
                    <p>• Like group agreeing on consistent note-taking format</p>
                    
                    <p><strong>Why this matters:</strong> Prevents "vanishing gradients" and keeps training stable - like having good group communication rules!</p>
                `
            }
        };
        
        let currentStep = 0;
        
        function showStep(step) {
            currentStep = step;
            
            // Update button states
            document.querySelectorAll('.btn').forEach((btn, index) => {
                btn.classList.toggle('active', index === step);
            });
            
            // Update chat messages
            const chatDiv = document.getElementById('chatMessages');
            chatDiv.innerHTML = '';
            
            chatData[step].forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.highlight ? 'highlight' : ''}`;
                
                messageDiv.innerHTML = `
                    <div class="avatar" style="background: ${msg.color}">${msg.sender[0]}</div>
                    <div class="message-content">
                        <div class="sender">${msg.sender} ${msg.position || ''}</div>
                        <div class="text">${msg.text}</div>
                        <div class="time">${msg.time}</div>
                    </div>
                `;
                
                chatDiv.appendChild(messageDiv);
            });
            
            // Update explanation
            const explanationDiv = document.getElementById('explanationSection');
            const exp = explanations[step];
            explanationDiv.innerHTML = `
                <div class="step-explanation">
                    <div class="step-title">${exp.title}</div>
                    <div class="step-content">${exp.content}</div>
                </div>
            `;
            
            // Scroll to top of explanations
            explanationDiv.scrollTop = 0;
        }
        
        // Initialize with first step
        showStep(0);
        
                    // Auto-advance demo (optional)
        let autoAdvance = false;
        function startAutoDemo() {
            if (autoAdvance) return;
            autoAdvance = true;
            
            const interval = setInterval(() => {
                currentStep = (currentStep + 1) % 7;
                showStep(currentStep);
                
                if (currentStep === 0) {
                    clearInterval(interval);
                    autoAdvance = false;
                }
            }, 4000);
        }
        
        // Add click handler for auto demo
        document.querySelector('.header').addEventListener('dblclick', startAutoDemo);
    </script>
</body>
</html>
