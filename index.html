<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformer as WhatsApp Group</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .header {
            background: #25d366;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            display: flex;
            height: 80vh;
        }
        
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
        }
        
        .explanation-section {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .chat-header {
            background: #075e54;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .group-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #25d366;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #ece5dd;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .message.highlight {
            background: rgba(255, 235, 59, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
        }
        
        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        
        .message-content {
            flex: 1;
        }
        
        .sender {
            font-weight: bold;
            color: #075e54;
            font-size: 14px;
            margin-bottom: 2px;
        }
        
        .text {
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .time {
            font-size: 11px;
            color: #667781;
            margin-top: 4px;
        }
        
        .step-explanation {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #25d366;
        }
        
        .step-title {
            color: #075e54;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .step-content {
            line-height: 1.6;
            color: #333;
        }
        
        .math-formula {
            background: #f0f8ff;
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            border-left: 3px solid #4CAF50;
        }
        
        .controls {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #25d366;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #128c7e;
        }
        
        .btn.active {
            background: #075e54;
        }
        
        .token-highlight {
            background: rgba(255, 193, 7, 0.3);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        .attention-arrow {
            color: #ff5722;
            font-weight: bold;
            margin: 0 5px;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .content {
                flex-direction: column;
                height: auto;
            }
            
            .chat-section {
                height: 50vh;
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
            }
            
            .explanation-section {
                height: 50vh;
                padding: 15px;
            }
            
            .header h1 {
                font-size: 18px;
            }
            
            .header p {
                font-size: 12px;
            }
            
            .controls {
                padding: 15px;
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .btn {
                padding: 8px 12px;
                font-size: 12px;
                flex: 1;
                min-width: 120px;
            }
            
            .step-title {
                font-size: 16px;
            }
            
            .math-formula {
                font-size: 12px;
                overflow-x: auto;
            }
            
            .message {
                margin-bottom: 12px;
            }
            
            .avatar {
                width: 30px;
                height: 30px;
                font-size: 11px;
            }
            
            .sender {
                font-size: 13px;
            }
            
            .text {
                font-size: 14px;
                padding: 6px 10px;
            }
            
            .time {
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .controls {
                flex-direction: column;
            }
            
            .btn {
                min-width: auto;
            }
            
            .header {
                padding: 15px;
            }
            
            .chat-messages {
                padding: 15px;
            }
            
            .explanation-section {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Transformer as WhatsApp Group Chat</h1>
            <p>Understanding AI through everyday group conversations</p>
        </div>
        
        <div class="content">
            <div class="chat-section">
                <div class="chat-header">
                    <div class="group-avatar">🧠</div>
                    <div>
                        <div style="font-weight: bold;">AI Study Group</div>
                        <div style="font-size: 12px; opacity: 0.8;">Alex, Maya, Sam, Chris</div>
                    </div>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be populated by JavaScript -->
                </div>
            </div>
            
            <div class="explanation-section" id="explanationSection">
                <!-- Explanations will be populated by JavaScript -->
            </div>
        </div>
        
        <div class="controls">
            <button class="btn active" onclick="showStep(0)">1. Input</button>
            <button class="btn" onclick="showStep(1)">2. Position</button>
            <button class="btn" onclick="showStep(2)">3. Encoder</button>
            <button class="btn" onclick="showStep(3)">4. Multi-Head</button>
            <button class="btn" onclick="showStep(4)">5. Decoder</button>
            <button class="btn" onclick="showStep(5)">6. Cross-Attention</button>
            <button class="btn" onclick="showStep(6)">7. Output</button>
        </div>4)">5. Prediction</button>
        </div>
    </div>

    <script>
        const chatData = {
            0: [ // Input Messages
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM", highlight: true },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM" }
            ],
            1: [ // Positional Encoding
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM", position: "[Position 1]" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM", position: "[Position 2]", highlight: true },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM", position: "[Position 3]" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM", position: "[Position 4]" }
            ],
            2: [ // Encoder - Self-Attention
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with <span class='token-highlight'>machine learning</span>?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What <span class='token-highlight'>specific topic</span>?", time: "2:16 PM", highlight: true },
                { sender: "Sam", color: "#2196f3", text: "I'm studying <span class='token-highlight'>transformers</span> right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "<span class='token-highlight'>Transformers</span> are fascinating!", time: "2:18 PM" },
                { sender: "🧠 Encoder", color: "#4caf50", text: "📖 Reading & understanding all past messages... Finding connections between 'machine learning' and 'transformers'", time: "Processing", highlight: true }
            ],
            3: [ // Multi-Head Attention (Encoder)
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM", highlight: true },
                { sender: "🧠 Encoder Head 1", color: "#9c27b0", text: "🔍 Grammar Focus: Checking sentence structure and syntax", time: "Processing" },
                { sender: "🧠 Encoder Head 2", color: "#2196f3", text: "🔍 Context Focus: Connecting ML → Transformers topic relationship", time: "Processing" },
                { sender: "🧠 Encoder Head 3", color: "#ff9800", text: "🔍 Sentiment Focus: Chris shows enthusiasm about transformers!", time: "Processing", highlight: true }
            ],
            4: [ // Decoder Start
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM" },
                { sender: "🎯 Decoder", color: "#ff5722", text: "✍️ Now generating response... Looking at encoder's understanding + what I've written so far", time: "Generating", highlight: true },
                { sender: "Chris", color: "#ff9800", text: "Let me explain how they work! 🤖", time: "2:19 PM" }
            ],
            5: [ // Cross-Attention (Decoder looking at Encoder)
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating!", time: "2:18 PM" },
                { sender: "Chris", color: "#ff9800", text: "Let me explain how they work! 🤖", time: "2:19 PM" },
                { sender: "🎯 Decoder", color: "#ff5722", text: "🔗 Cross-Attention: Consulting encoder's analysis while generating 'A transformer processes...'", time: "Generating", highlight: true },
                { sender: "Chris", color: "#ff9800", text: "A transformer processes text like our group chat - everyone reads, connects ideas, then responds!", time: "2:19 PM" }
            ],
            6: [ // Final Prediction
                { sender: "Alex", color: "#e91e63", text: "Hey guys, can anyone help me with machine learning?", time: "2:15 PM" },
                { sender: "Maya", color: "#9c27b0", text: "Sure! What specific topic?", time: "2:16 PM" },
                { sender: "Sam", color: "#2196f3", text: "I'm studying transformers right now", time: "2:17 PM" },
                { sender: "Chris", color: "#ff9800", text: "Transformers are fascinating! Let me explain how they work! 🤖", time: "2:18 PM" },
                { sender: "Chris", color: "#ff9800", text: "A transformer processes text like our group chat - everyone reads, connects ideas, then responds!", time: "2:19 PM", highlight: true },
                { sender: "🎯 Final Output", color: "#4caf50", text: "✅ Complete response generated! Encoder understood context → Decoder generated relevant explanation", time: "Complete", highlight: true }
            ]
        };
        
        const explanations = {
            0: {
                title: "1. Input Embeddings = Messages in Chat",
                content: `
                    <p><strong>What's happening:</strong> Each message in the group chat gets converted into a mathematical vector (like a unique fingerprint).</p>
                    
                    <div class="math-formula">
                        Each message → Vector: x<sub>t</sub> ∈ R<sup>d_model</sup>
                        <br>Where t = message position, d_model = vector size
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• Alex's message "Hey guys, can anyone help me with machine learning?" becomes a 512-dimensional vector</p>
                    <p>• Each word gets its own vector: ["Hey"→[0.2,0.8,...],"guys"→[0.1,0.4,...], etc.]</p>
                    <p>• Just like how WhatsApp stores each message with metadata, transformers store each word with rich mathematical information</p>
                    
                    <p><strong>Why this matters:</strong> The AI needs to convert human language into numbers it can process, just like how your phone converts your voice into digital signals.</p>
                `
            },
            1: {
                title: "2. Positional Encoding = Message Timestamps",
                content: `
                    <p><strong>What's happening:</strong> Since order matters in conversations, we add position information to each message vector.</p>
                    
                    <div class="math-formula">
                        PE(pos,2i) = sin(pos/10000<sup>2i/d_model</sup>)
                        <br>PE(pos,2i+1) = cos(pos/10000<sup>2i/d_model</sup>)
                        <br>Final input: z<sub>t</sub> = x<sub>t</sub> + PE<sub>t</sub>
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• Maya's message at 2:16 PM gets position encoding [Position 2]</p>
                    <p>• Just like WhatsApp shows timestamps, the AI knows "Sure! What specific topic?" came AFTER "Hey guys, can anyone help me..."</p>
                    <p>• Without this, the AI might think Maya asked the question first!</p>
                    
                    <p><strong>Why this matters:</strong> "I'm not going" vs "I'm going, not!" - word order completely changes meaning!</p>
                `
            },
            2: {
                title: "3. Encoder = Friends Reading & Understanding",
                content: `
                    <p><strong>What's happening:</strong> The encoder acts like friends in the group carefully reading and understanding ALL the messages to build context.</p>
                    
                    <div class="math-formula">
                        Attention(Q,K,V) = softmax(QK<sup>T</sup>/√d<sub>k</sub>)V
                        <br>Q = queries (what am I looking for?)
                        <br>K = keys (labels/topics in past messages)  
                        <br>V = values (actual message content)
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• 🧠 Encoder reads ALL messages: Alex's question + Maya's offer + Sam's mention + Chris's excitement</p>
                    <p>• It finds the connection: "machine learning" relates to "transformers"</p>
                    <p>• Creates a rich understanding of the conversation context</p>
                    <p>• This understanding will help generate the perfect response</p>
                    
                    <p><strong>Why this matters:</strong> Before responding, good friends read the whole conversation to understand what's really being discussed!</p>
                `
            },
            3: {
                title: "4. Multi-Head Attention (Encoder) = Multiple Perspectives",
                content: `
                    <p><strong>What's happening:</strong> The encoder uses multiple "attention heads" - like having different friends each focus on different aspects of the conversation.</p>
                    
                    <div class="math-formula">
                        MHA(X) = [head₁; head₂; ...; head_h]W^O
                        <br>Each head focuses on different patterns
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• <strong>🧠 Head 1 (Grammar):</strong> "Are the questions properly formed? Is the syntax correct?"</p>
                    <p>• <strong>🧠 Head 2 (Context):</strong> "How does ML relate to transformers? What's the topic flow?"</p>
                    <p>• <strong>🧠 Head 3 (Sentiment):</strong> "Chris sounds excited! Maya is helpful! Sam is studying!"</p>
                    <p>• Combined understanding is much richer than any single perspective</p>
                    
                    <p><strong>Why this matters:</strong> Different friends notice different things - together they get the full picture of the conversation!</p>
                `
            },
            4: {
                title: "5. Decoder Starts = Begin Writing Response",
                content: `
                    <p><strong>What's happening:</strong> The decoder starts generating a response, using both the encoder's understanding AND what it has generated so far.</p>
                    
                    <div class="math-formula">
                        Masked Self-Attention: Can't peek at future words
                        <br>Cross-Attention: Looks at encoder's understanding
                        <br>Feed Forward: Processes and refines
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• 🎯 Decoder thinks: "Based on the conversation, I should explain transformers"</p>
                    <p>• It starts typing: "Let me explain how they work! 🤖"</p>
                    <p>• Unlike encoder (reads everything), decoder generates word-by-word</p>
                    <p>• Can't "cheat" by looking ahead - just like real typing!</p>
                    
                    <p><strong>Why this matters:</strong> When you type a response, you build it word by word, considering what you've already written!</p>
                `
            },
            5: {
                title: "6. Cross-Attention = Consulting the Context",
                content: `
                    <p><strong>What's happening:</strong> While generating each word, the decoder "looks back" at the encoder's understanding of the conversation.</p>
                    
                    <div class="math-formula">
                        Cross-Attention(Q_decoder, K_encoder, V_encoder)
                        <br>Decoder asks: "What did the encoder understand?"
                        <br>Encoder provides: Rich context about the conversation
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• 🎯 Decoder: "I'm generating 'A transformer processes...'"</p>
                    <p>• 🔗 Cross-Attention: "Let me check what the encoder understood about ML and transformers"</p>
                    <p>• 🧠 Encoder: "They want to learn ML, specifically about transformers, in simple terms"</p>
                    <p>• 🎯 Decoder: "Perfect! I'll explain using the group chat analogy"</p>
                    
                    <p><strong>Why this matters:</strong> Good responses stay relevant to the original conversation - cross-attention ensures this!</p>
                `
            },
            6: {
                title: "7. Final Output = Complete Response Generated",
                content: `
                    <p><strong>What's happening:</strong> The transformer has successfully generated a complete, contextually appropriate response using the encoder-decoder architecture.</p>
                    
                    <div class="math-formula">
                        P(y<sub>t</sub>|y<sub>&lt;t</sub>, X) = softmax(W<sub>o</sub>h<sub>t</sub>)
                        <br>Where h<sub>t</sub> = decoder hidden state + encoder context
                    </div>
                    
                    <p><strong>Real WhatsApp analogy:</strong></p>
                    <p>• ✅ <strong>Encoder:</strong> Understood the full conversation context</p>
                    <p>• ✅ <strong>Decoder:</strong> Generated relevant response word-by-word</p>
                    <p>• ✅ <strong>Cross-Attention:</strong> Kept response connected to original question</p>
                    <p>• ✅ <strong>Result:</strong> "A transformer processes text like our group chat - everyone reads, connects ideas, then responds!"</p>
                    
                    <p><strong>Why this matters:</strong> This is exactly how ChatGPT, GPT-4, Claude, and other AI models work - encoder understands your question, decoder generates the response!</p>
                `
            }
        };
        
        let currentStep = 0;
        
        function showStep(step) {
            currentStep = step;
            
            // Update button states
            document.querySelectorAll('.btn').forEach((btn, index) => {
                btn.classList.toggle('active', index === step);
            });
            
            // Update chat messages
            const chatDiv = document.getElementById('chatMessages');
            chatDiv.innerHTML = '';
            
            chatData[step].forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.highlight ? 'highlight' : ''}`;
                
                messageDiv.innerHTML = `
                    <div class="avatar" style="background: ${msg.color}">${msg.sender[0]}</div>
                    <div class="message-content">
                        <div class="sender">${msg.sender} ${msg.position || ''}</div>
                        <div class="text">${msg.text}</div>
                        <div class="time">${msg.time}</div>
                    </div>
                `;
                
                chatDiv.appendChild(messageDiv);
            });
            
            // Update explanation
            const explanationDiv = document.getElementById('explanationSection');
            const exp = explanations[step];
            explanationDiv.innerHTML = `
                <div class="step-explanation">
                    <div class="step-title">${exp.title}</div>
                    <div class="step-content">${exp.content}</div>
                </div>
            `;
            
            // Scroll to top of explanations
            explanationDiv.scrollTop = 0;
        }
        
        // Initialize with first step
        showStep(0);
        
                    // Auto-advance demo (optional)
        let autoAdvance = false;
        function startAutoDemo() {
            if (autoAdvance) return;
            autoAdvance = true;
            
            const interval = setInterval(() => {
                currentStep = (currentStep + 1) % 7;
                showStep(currentStep);
                
                if (currentStep === 0) {
                    clearInterval(interval);
                    autoAdvance = false;
                }
            }, 4000);
        }
        
        // Add click handler for auto demo
        document.querySelector('.header').addEventListener('dblclick', startAutoDemo);
    </script>
</body>
</html>
